name: Build and publish ENGINEER PRO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.4.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: engineer-pro-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Version must look like 0.4.0'
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            throw "npm install failed"
          }

      - name: Set package version for build
        shell: pwsh
        run: |
          $current = node -p "require('./package.json').version"
          if ($current -eq $env:RELEASE_VERSION) {
            Write-Host "Version already set: $current"
          } else {
            npm version $env:RELEASE_VERSION --no-git-tag-version --ignore-scripts
            if ($LASTEXITCODE -ne 0) {
              throw "npm version failed"
            }
          }

      - name: Build Windows installer and update metadata
        run: npm run dist -- --publish never

      - name: Verify installer assets
        shell: pwsh
        run: |
          $v = $env:RELEASE_VERSION
          $files = @(
            "dist/ENGINEER_PRO_Setup_$v.exe",
            "dist/ENGINEER_PRO_Setup_$v.exe.blockmap",
            "dist/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing build asset: $file"
            }
            Write-Host "OK: $file"
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists"
          }
          gh release create $tag `
            "dist/ENGINEER_PRO_Setup_$env:RELEASE_VERSION.exe" `
            "dist/ENGINEER_PRO_Setup_$env:RELEASE_VERSION.exe.blockmap" `
            "dist/latest.yml" `
            --target "$env:GITHUB_SHA" `
            --title "ENGINEER PRO $env:RELEASE_VERSION" `
            --notes "ENGINEER PRO $env:RELEASE_VERSION" `
            --latest
