<!doctype html><html lang="uk"><meta charset="utf-8"><title>ENGINEER PRO — синхронізація</title><style>body{font:16px system-ui;background:#101820;color:#fff;max-width:640px;margin:35px auto}input,button{padding:12px;margin:7px 0;width:100%;box-sizing:border-box}button{cursor:pointer}small{color:#bbb}</style><h1>Синхронізація Supabase</h1><p>Ручна синхронізація: завантаження замінює локальні дані після резервного копіювання. Закрийте й відкрийте основне вікно після завантаження.</p><input id="url" placeholder="https://PROJECT.supabase.co"><input id="key" type="password" placeholder="Supabase publishable / anon key"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button onclick="run('upload')">Вивантажити дані Windows у хмару</button><button onclick="run('download')">Завантажити дані з хмари у Windows</button><p id="status"></p><small>Не вводьте service_role/secret key. Пароль не зберігається.</small><script>async function run(direction){const status=document.getElementById('status');status.textContent='Виконується…';try{const result=await window.engineerSync.run({config:{url:document.getElementById('url').value,anonKey:document.getElementById('key').value},email:document.getElementById('email').value,password:document.getElementById('password').value,direction});status.textContent=JSON.stringify(result)}catch(e){status.textContent=e.message}}</script></html>
